[project]
name = "xvla"
version = "0.1.0"
description = "χ-VLA: a fully tensor-decomposable Vision-Language-Action model"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
compute = ["modal"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xvla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
